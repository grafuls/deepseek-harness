# nginx TLS reverse proxy for dsh web.
#
# Replace dsh.example.com below with your real hostname, then install on the
# server that also runs dsh web. On RHEL/Fedora nginx only includes
# /etc/nginx/conf.d/*.conf (NOT Debian-style sites-available/sites-enabled):
#   sudo cp nginx-dsh-web.conf /etc/nginx/conf.d/dsh-web.conf
# RHEL only: allow nginx to connect to the local backend (SELinux defaults to off):
#   sudo setsebool -P httpd_can_network_connect 1
#   sudo nginx -t && sudo systemctl reload nginx
#
# TLS: put your cert/key at /etc/nginx/ssl/dsh.example.com.{pem,key} (or point
# the ssl_certificate* lines at your files). For a first bring-up you can
# generate a self-signed pair with a SAN covering the FQDN:
#   sudo mkdir -p /etc/nginx/ssl && cd /etc/nginx/ssl
#   sudo openssl req -x509 -nodes -newkey rsa:2048 \
#     -keyout dsh.example.com.key -out dsh.example.com.pem -days 825 \
#     -subj "/CN=dsh.example.com" \
#     -addext "subjectAltName=DNS:dsh.example.com"
#
# Start dsh web on the SAME host, bound to loopback, with your hostname
# declared trusted for the /api fence:
#   dsh web --host 127.0.0.1 --trusted-host dsh.example.com --no-open
#
# The --trusted-host flag is not optional: nginx forwards the original Host
# header, and the /api browser-trust fence (DNS-rebinding defense) refuses any
# Host that is neither loopback nor a declared authority. A hostname is not an
# IP literal, so it is never auto-trusted.
#
# Bind loopback and let nginx own the network edge. dsh web has NO
# authentication layer; binding 0.0.0.0 would leave an unauthenticated agent
# runner (bash/fs tools = remote code execution on this box) directly
# reachable on :3080 past nginx. Loopback bind exposes dsh web only through
# this TLS entry point.

# Promote the client's Connection header so the /api/events.mux and
# /api/events.host WebSocket downlinks survive the proxy.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain HTTP -> HTTPS so the hostname works without typing a port.
server {
    listen 80;
    server_name dsh.example.com;
    return 301 https://$host$request_uri;
}

server {
    # Use `listen 443 ssl http2;` on nginx >= 1.25.1. RHEL 9 ships 1.20,
    # where that fails; `listen 443 ssl;` (HTTP/1.1 over TLS) is always fine.
    listen 443 ssl;
    server_name dsh.example.com;

    # Point at the key/pem files you create.
    ssl_certificate     /etc/nginx/ssl/dsh.example.com.pem;
    ssl_certificate_key /etc/nginx/ssl/dsh.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;

    # Clear dsh's own /api body bound: 300 MiB max JSON body, sized for the
    # 200 MiB aggregate image limit after base64 expansion. nginx's 1m default
    # would reject large attachments before they ever reach the API.
    client_max_body_size 400m;

    location / {
        proxy_pass http://127.0.0.1:3080;

        proxy_http_version 1.1;

        # Keep the original hostname for the /api trust fence and the browser's
        # Origin/host same-origin check.
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Stream /api event frames as they arrive instead of buffering them.
        proxy_buffering off;

        # Agent turns can run long; do not let nginx time out an in-flight turn.
        proxy_connect_timeout 10s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}
