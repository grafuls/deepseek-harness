# The dsh-collab-bundle patch: the multi-user collab overlay over the dsh-base
# and dsh-web-app layers. Apply this third layer (e.g.
# `dsh --profile web-collab`) to turn the shared web process into a
# Google-OAuth multi-user instance. Without this layer the default single-user
# web profile is unchanged.
#
# The collab-auth row deliberately carries NO OAuth credentials: an operator
# supplies clientId/clientSecret/secret (and secureCookies behind TLS) in the
# profile's cordis.patch.yml by id before users sign in. The OAuth redirect
# origin is derived per sign-in from the request when neither baseUrl nor
# redirectUri is pinned, so a remote loopback-free deployment needs no origin
# configuration; pin baseUrl/redirectUri to override the request origin. The
# collab data root defaults to `<dshHome>/collab`, where the durable
# user/workspace registries and the per-workspace data directories live.
- insert:
    - id: collab-users
      name: '@deepseek-ai/dsh-collab-users'

    - id: collab-workspaces
      name: '@deepseek-ai/dsh-collab-workspaces'

    - id: collab-auth
      name: '@deepseek-ai/dsh-collab-auth'

    - id: collab-api
      name: '@deepseek-ai/dsh-collab-api'
      # Operator config only: `gitToken` (+ `gitHost`/`gitUsername`) lets the
      # server clone private repositories; the token is never shown in the GUI.
      # It is deliberately NOT declared here — supply it in the profile's
      # cordis.patch.yml by id, the same way the collab-auth secrets are.

    # Browser half: the collab sign-in gate. This row declares dsh.client, so
    # the modules roster serves its bundle; the sign-in overlay renders only
    # while the collab surface reports unauthenticated (single-user installs
    # are visually unchanged).
    - id: ui-auth
      name: '@deepseek-ai/dsh-client-ui-auth'

    # Browser half: the collab workspaces manager. This row declares
    # dsh.client, so the modules roster serves its bundle; the foot action and
    # the overlay panel render only while the collab surface reports ready
    # (single-user installs are visually unchanged).
    - id: ui-collab
      name: '@deepseek-ai/dsh-client-ui-collab'
